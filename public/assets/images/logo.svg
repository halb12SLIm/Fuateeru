<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="honeyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
  </defs>
  <!-- Hexagon background -->
  <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" fill="url(#honeyGold)" stroke="#D49B00" stroke-width="4" stroke-linejoin="round"/>
  <!-- Inner hexagon -->
  <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Bee Body -->
  <ellipse cx="50" cy="53" rx="14" ry="19" fill="#FBBF24" stroke="#1F2937" stroke-width="2.5"/>
  <!-- Stripes -->
  <path d="M37 46 Q50 49 63 46" stroke="#1F2937" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M36 53 Q50 56 64 53" stroke="#1F2937" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M38 60 Q50 63 62 60" stroke="#1F2937" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Head -->
  <circle cx="50" cy="31" r="8" fill="#1F2937"/>
  <!-- Antennae -->
  <path d="M47 25 Q42 17 38 18" stroke="#1F2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="38" cy="18" r="1.5" fill="#1F2937"/>
  <path d="M53 25 Q58 17 62 18" stroke="#1F2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="62" cy="18" r="1.5" fill="#1F2937"/>
  <!-- Wings Left & Right -->
  <path d="M40 43 C26 34 22 47 38 49 Z" fill="#E0F2FE" fill-opacity="0.85" stroke="#0284C7" stroke-width="1.5"/>
  <path d="M60 43 C74 34 78 47 62 49 Z" fill="#E0F2FE" fill-opacity="0.85" stroke="#0284C7" stroke-width="1.5"/>
  <!-- Stinger -->
  <polygon points="48,72 52,72 50,77" fill="#1F2937"/>
</svg>
